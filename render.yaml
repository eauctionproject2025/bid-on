# Bid On on Render: full website + API + Postgres (Singapore).
# Public site: https://bid-on.onrender.com  ·  API: https://bid-on-api.onrender.com

services:
  - type: web
    name: bid-on
    runtime: node
    plan: free
    region: singapore
    branch: master
    rootDir: frontend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://bid-on-api.onrender.com

  - type: web
    name: bid-on-api
    runtime: node
    plan: free
    region: singapore
    branch: master
    rootDir: backend
    # prisma and typescript are devDependencies; NODE_ENV=production would skip them.
    buildCommand: npm install --include=dev && npm run build
    # prisma migrate deploy, then the API (see backend package.json "start")
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: bid-on-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        value: https://bid-on.onrender.com
      # Free web services have no persistent disk. Uploaded images reset on each deploy.
      - key: UPLOAD_DIR
        value: uploads
      - key: STRIPE_CURRENCY
        value: usd
      # Optional email (set in Render Dashboard → bid-on-api → Environment):
      # RESEND_API_KEY=re_...
      # RESEND_FROM=Bid On <onboarding@resend.dev>
      # Without these, registration still works: API returns verifyUrl for on-screen verification.

databases:
  - name: bid-on-db
    plan: free
    region: singapore
    databaseName: bidon
    user: bidon
    postgresMajorVersion: "16"
    # API uses the internal connection string. Block public database access.
    ipAllowList: []
